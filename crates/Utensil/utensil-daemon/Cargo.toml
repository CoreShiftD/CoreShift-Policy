[package]
name = "utensil-daemon"
version = "0.1.0"
edition = "2024"
description = "Composed CoreShift policy daemon — foreground, deep-sleep, watchdog, battery in one reactor"
license = "MPL-2.0"
repository = "https://github.com/CoreShiftD/CoreShift-Policy"

[[bin]]
name = "utensil-daemon"
path = "src/main.rs"

[dependencies]
coreshift-core       = { workspace = true }
coreshift-foreground = { workspace = true }
utensil-ds           = { workspace = true }
utensil-wd           = { workspace = true }
utensil-bs           = { workspace = true }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
debug = 0
incremental = false
strip = "none"
